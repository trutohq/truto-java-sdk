name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["11", "17", "21"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generated models are up to date
        run: |
          python3 codegen/normalize_spec.py spec/openapi.json > codegen/models.json
          python3 codegen/generate_java.py codegen/models.json src/main/java/one/truto/sdk/models
          git diff --exit-code -- codegen/models.json src/main/java/one/truto/sdk/models

      - name: Build, lint (-Xlint:all) and test
        run: mvn -B verify

      - name: Compile examples
        run: |
          mvn -B -q dependency:build-classpath -Dmdep.outputFile=cp.txt
          mkdir -p target/examples
          javac -Xlint:all --release 11 -cp "target/classes:$(cat cp.txt)" -d target/examples examples/*.java
